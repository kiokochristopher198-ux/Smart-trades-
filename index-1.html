<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matches/Differs Bot</title>
<style>body{font-family:Arial,sans-serif;background:#10131a;color:#eee;margin:0;padding:18px}.box{max-width:700px;margin:auto;background:#181d27;border-radius:16px;padding:18px;box-shadow:0 8px 30px #0008}h1{font-size:22px;margin:0 0 14px}.grid{display:grid;gap:10px}label{font-size:13px;color:#aaa}select,input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #394252;background:#0f131a;color:#fff}button{font-weight:700;cursor:pointer;background:#2463eb;border:0}.stop{background:#a92727}.status{margin:12px 0;padding:10px;border-radius:10px;background:#0d1117;color:#8fd3ff}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.card{background:#0f131a;padding:14px;border-radius:12px}.big{font-size:28px;font-weight:800}.muted{color:#999;font-size:12px}.log{height:130px;overflow:auto;background:#0b0e13;padding:10px;border-radius:10px;font-size:12px;white-space:pre-wrap;margin-top:12px}</style></head>
<body><div class="box"><h1>Matches/Differs Bot</h1><div class="grid">
<label>Index — choose manually</label><select id="symbol"><option>Loading current Deriv symbols...</option></select>
<label>Lookback ticks</label><input id="lookback" type="number" value="100" min="20" max="500">
<label>Stake (variable)</label><input id="stake" type="number" value="1" min="0.01" step="0.01">
<label>Minimum confidence %</label><input id="minconf" type="number" value="15" min="0" max="100">
<label>Entry countdown (seconds)</label><input id="countdown" type="number" value="5" min="1" max="30">
<button id="connect">CONNECT / ANALYZE</button><button id="stop" class="stop">STOP</button></div>
<div id="status" class="status">Loading current Deriv symbols…</div><div class="cards">
<div class="card"><div class="muted">Predicted digit</div><div id="pred" class="big">—</div></div><div class="card"><div class="muted">Confidence</div><div id="conf" class="big">—</div></div><div class="card"><div class="muted">Last digit</div><div id="last" class="big">—</div></div><div class="card"><div class="muted">Entry</div><div id="entry" class="big">—</div></div></div><div id="log" class="log"></div></div>
<script>
const NEW_WS='wss://api.derivws.com/trading/v1/options/ws/public';
const OLD_WS='wss://ws.derivws.com/websockets/v3?app_id=1089';
let ws=null, symbolWs=null, running=false, digits=[], timer=null, symbols=[];
const $=id=>document.getElementById(id);const log=m=>{$('log').textContent=new Date().toLocaleTimeString()+'  '+m+'\n'+$('log').textContent};function setStatus(x){$('status').textContent=x}
function normalize(s){return {code:s.underlying_symbol||s.symbol,name:s.underlying_symbol_name||s.display_name||s.underlying_symbol||s.symbol||'',market:(s.market||'').toLowerCase(),submarket:(s.submarket||'').toLowerCase(),subgroup:(s.subgroup||'').toLowerCase()}}
function synthetic(s){let n=(s.name+' '+s.code).toLowerCase();return s.market.includes('synthetic')||s.submarket.includes('synthetic')||s.subgroup.includes('synthetic')||/volatility|crash|boom|jump|range break|drift|step|bear|bull/.test(n)}
function fill(list){symbols=list.filter(x=>x.code).map(normalize);let syn=symbols.filter(synthetic);let use=syn.length?syn:symbols;use.sort((a,b)=>a.name.localeCompare(b.name));$('symbol').innerHTML='';use.forEach(s=>{let o=document.createElement('option');o.value=s.code;o.textContent=s.name+'  ('+s.code+')';$('symbol').appendChild(o)});if(use.length){setStatus('Symbols loaded. Choose an index manually, then CONNECT / ANALYZE.');log('Loaded '+use.length+' current symbols.')}else{setStatus('Deriv returned no symbols.');log('No symbols returned from either API endpoint.')}}
function loadSymbols(){setStatus('Connecting to Deriv market data…');let triedOld=false;function open(url,isOld){let w=new WebSocket(url);symbolWs=w;w.onopen=()=>{w.send(JSON.stringify({active_symbols:'brief',...(isOld?{product_type:'basic'}:{}),req_id:1}))};w.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.msg_type==='active_symbols'){let list=d.active_symbols||[];if(list.length){fill(list);try{w.close()}catch{}return}if(!isOld&&!triedOld){triedOld=true;try{w.close()}catch{}open(OLD_WS,true)}}if(d.error&&!isOld&&!triedOld){triedOld=true;try{w.close()}catch{}open(OLD_WS,true)}else if(d.error){setStatus('Deriv symbol error: '+(d.error.message||d.error.code));log(JSON.stringify(d.error))}};w.onerror=()=>{if(!isOld&&!triedOld){triedOld=true;try{w.close()}catch{}open(OLD_WS,true)}else setStatus('Could not connect to Deriv market data.')};}open(NEW_WS,false)}
function digit(q){let s=String(q);if(/[eE]/.test(s))s=Number(q).toFixed(10);s=s.replace(/[^0-9]/g,'');return s?s.slice(-1):null}
function analyze(){let n=Math.max(20,Number($('lookback').value)||100),a=digits.slice(-n);if(!a.length)return;let scores=Array(10).fill(0);a.forEach((d,i)=>scores[+d]+=1+(i/a.length)*2);let p=0;for(let i=1;i<10;i++)if(scores[i]>scores[p])p=i;let total=scores.reduce((x,y)=>x+y,0)||1,c=scores[p]/total*100;$('pred').textContent=p;$('conf').textContent=c.toFixed(1)+'%';if(c>=Number($('minconf').value))startCountdown(p,c)}
function startCountdown(p,c){clearInterval(timer);let n=Math.max(1,Number($('countdown').value)||5);$('entry').textContent=n+'s';timer=setInterval(()=>{n--;if(n<=0){clearInterval(timer);$('entry').textContent='SIGNAL '+p;log('Signal: digit '+p+' | confidence '+c.toFixed(1)+'% | stake '+$('stake').value)}else $('entry').textContent=n+'s'},1000)}
function connect(){if(running)return;let sym=$('symbol').value;if(!sym||sym.startsWith('No ')){setStatus('Choose a valid current Deriv symbol first.');return}running=true;digits=[];$('entry').textContent='—';setStatus('Connecting to '+sym+' and waiting for live ticks…');ws=new WebSocket(NEW_WS);ws.onopen=()=>{ws.send(JSON.stringify({contracts_for:sym,req_id:2}));ws.send(JSON.stringify({ticks_history:sym,count:Number($('lookback').value)||100,end:'latest',style:'ticks',req_id:3}));ws.send(JSON.stringify({ticks:sym,subscribe:1,req_id:4}))};ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.error){setStatus('Deriv error: '+(d.error.message||d.error.code));log(JSON.stringify(d.error));return}if(d.msg_type==='contracts_for'){let raw=JSON.stringify(d);let ok=/DIGITMATCH|DIGITDIFF|MATCH|DIFF/i.test(raw);setStatus(ok?'Live analysis running — Matches/Differs appears available.':'Live ticks running — check contract availability for this index.')}if(d.msg_type==='history'&&d.history&&Array.isArray(d.history.prices)){d.history.prices.forEach(q=>{let x=digit(q);if(x!==null)digits.push(x)});analyze()}if(d.msg_type==='tick'&&d.tick){let x=digit(d.tick.quote);if(x!==null){digits.push(x);if(digits.length>1000)digits.shift();$('last').textContent=x;analyze()}}};ws.onerror=()=>setStatus('Live connection error.');ws.onclose=()=>{if(running)setStatus('Disconnected.')}}
function stop(){running=false;clearInterval(timer);if(ws){try{ws.close()}catch{}}ws=null;$('entry').textContent='STOPPED';setStatus('Stopped.')}
$('connect').onclick=connect;$('stop').onclick=stop;loadSymbols();
</script></body></html>
